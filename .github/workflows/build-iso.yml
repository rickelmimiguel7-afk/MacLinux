
name: Build MacLinux ISO

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common

      - name: Configure MacLinux live system
        run: |
          mkdir maclinux-live
          cd maclinux-live

          sudo lb config \
            --mode debian \
            --distribution noble \
            --architectures amd64 \
            --archive-areas "main universe" \
            --binary-images iso-hybrid \
            --bootloader grub \
            --debian-installer false \
            --apt-recommends true

      - name: Add MacLinux packages
        run: |
          cd maclinux-live
          mkdir -p config/package-lists

          cat > config/package-lists/maclinux.list.chroot <<'EOF'
          systemd
          systemd-sysv
          sudo
          network-manager
          xserver-xorg
          sddm
          qt6-base-dev
          qml6-module-qtquick
          qml6-module-qtquick-controls
          qml6-module-qtquick-layouts
          EOF

      - name: Build ISO image
        run: |
          cd maclinux-live
          sudo lb build

      - name: Find generated ISO
        run: |
          find maclinux-live -maxdepth 2 -type f -name "*.iso" -print
          test -n "$(find maclinux-live -maxdepth 2 -type f -name '*.iso' -print -quit)"

      - name: Upload MacLinux ISO
        uses: actions/upload-artifact@v4
        with:
          name: MacLinux-Experimental-ISO
          path: maclinux-live/*.iso
          if-no-files-found: error
          compression-level: 0
